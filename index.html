<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>챗봇 테스트</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1b1f1d;--ink2:#545c58;--line:#dfe3de;--accent:#1f5f8b}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1c201e;--ink:#e8ebe7;--ink2:#a9b1ac;--line:#2c322f;--accent:#7fb4dc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
nav a{color:var(--ink2);text-decoration:none;margin-left:20px;font-size:15px}
.hero{padding:72px 0 56px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.2;margin:0 0 14px;letter-spacing:-.03em}
.hero p{color:var(--ink2);max-width:560px;margin:0}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--ink2);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:56px}
@media(max-width:760px){.grid{grid-template-columns:1fr}nav{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--ink2);font-size:15px}
h2{font-size:24px;margin:0 0 16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{color:var(--ink2);font-weight:600}
footer{margin-top:64px;padding:24px 0 96px;border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><span class="logo">테스트 사이트</span><nav><a href="#about">소개</a><a href="#contact">문의</a></nav></div></header>
<main class="wrap">
  <section class="hero">
    <span class="badge">챗봇 테스트용 페이지</span>
    <h1>오른쪽 아래 상담 창에<br>궁금한 걸 물어보세요</h1>
    <p>이 페이지는 챗봇 위젯이 실제 홈페이지에서 어떻게 보이고 답하는지 시험하려고 만든 빈 사이트예요.</p>
  </section>

  <section id="about" class="grid">
    <div class="card"><h3>제품 질문</h3><p>제품 종류나 용도를 물어보면 올린 자료를 바탕으로 답해요.</p></div>
    <div class="card"><h3>견적 문의</h3><p>견적이 필요하면 문의서를 열어 필요한 내용을 남길 수 있어요.</p></div>
    <div class="card"><h3>담당자 연결</h3><p>자료에 없는 질문은 메일을 남기면 담당자가 답해요.</p></div>
  </section>

  <footer id="contact">챗봇 위젯 시험용 페이지예요. 실제 회사 홈페이지가 아니에요.</footer>
</main>

<script src="https://inquiry-desk-production-aaa6e4ea.up.railway.app/widget.js" data-tenant="복스컴퍼니" defer></script>
</body>
</html>
